<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#F6F7FB;font-family:Arial,Helvetica,sans-serif;color:#0E1B33;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #E3E7F0;border-radius:16px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 8px;font-size:22px;font-weight:bold;">grifo</p>
          <h1 style="margin:0 0 16px;font-size:20px;">Confirme seu e-mail</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3A4664;">
            Falta só um passo para começar a estudar. Clique no botão abaixo para confirmar este endereço de e-mail.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding"
               style="display:inline-block;padding:12px 20px;background:#2453E6;color:#FFFFFF;border-radius:10px;text-decoration:none;font-weight:bold;">
              Confirmar e-mail
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#5B6785;">
            Se você não criou uma conta no Grifo, ignore esta mensagem.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
